# Dual-site nginx config for ONE VPS
# Copy to: /etc/nginx/sites-available/two-sites
# Enable:  ln -sf /etc/nginx/sites-available/two-sites /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl reload nginx
#
# Folders on VPS:
#   /var/www/mitld   = form / TG site (from repo folder mitld/)
#   /var/www/portal  = MitID portal SPA (from repo folder portal/)
#
# Mapping (as requested):
#   erhvervsupport.org  → mitld
#   nulstilmitid.org     → portal

# ---- Site 1: mitld on erhvervsupport.org ----
server {
    listen 80;
    listen [::]:80;
    server_name erhvervsupport.org www.erhvervsupport.org;
    root /var/www/mitld;
    index index.php index.html;

    client_max_body_size 16M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # adjust version if needed
    }

    location ~ ^/data/ {
        deny all;
    }
}

# ---- Site 2: portal on nulstilmitid.org ----
server {
    listen 80;
    listen [::]:80;
    server_name nulstilmitid.org www.nulstilmitid.org;
    root /var/www/portal;
    index index.php index.html;

    client_max_body_size 16M;

    # Block sensitive paths (same as .htaccess)
    location ~ ^/(config|data)/ {
        deny all;
    }
    location ~* \.(sql|sqlite|sqlite3|env|log)$ {
        deny all;
    }

    # API router
    location /api/ {
        rewrite ^/api/(.*)$ /api/index.php?__route__=$1 last;
    }

    # SPA + PHP front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    location ~* \.(js|css|webp|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
