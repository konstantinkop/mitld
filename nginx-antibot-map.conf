# Place in /etc/nginx/conf.d/antibot-map.conf  (http context)
# Then: nginx -t && systemctl reload nginx

map $http_user_agent $juj_bad_bot {
  default 0;
  ~*(GPTBot|ChatGPT-User|OAI-SearchBot) 1;
  ~*(ClaudeBot|Claude-Web|anthropic-ai|Claude-User|Claude-SearchBot) 1;
  ~*(PerplexityBot|Perplexity-User) 1;
  ~*(Google-Extended|Google-CloudVertexBot|Gemini-Deep-Research) 1;
  ~*(Applebot-Extended|Applebot) 1;
  ~*(Meta-ExternalAgent|meta-externalagent|FacebookBot|facebookexternalhit) 1;
  ~*(Bytespider|CCBot|cohere-training-data-crawler|Diffbot|Amazonbot) 1;
  ~*(Bingbot|YandexBot|Baiduspider|DuckDuckBot|Slurp) 1;
  ~*(AhrefsBot|SemrushBot|MJ12bot|DotBot|PetalBot|MauiBot|Sogou|rogerbot) 1;
  ~*(archive\.org_bot|Scrapy|Crawl4AI|FirecrawlAgent|ApifyBot) 1;
  ~*(TavilyBot|YouBot|Kimi-User|DeepSeekBot|MistralAI-User|PhindBot|Timpibot) 1;
  ~*(ImagesiftBot|img2dataset|omgili|omgilibot|ShapBot|TerraCotta|Thinkbot|TwinAgent) 1;
  ~*(VelenPublicWebCrawler|WARDBot|wpbot|YaK|ZanistaBot) 1;
  ~*(sqlmap|Nikto|nmap|masscan|nuclei|gobuster|wfuzz|metasploit) 1;
  ~*(acunetix|netsparker|OpenVAS|w3af|ZmEu|Havij|sqlninja|dirbuster|arachni|vega) 1;
}
